<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="160" height="50">
  <!-- Card Background -->
  <rect width="160" height="50" rx="8" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="159" height="49" rx="7.5" fill="none" stroke="#087A3E" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Delivery Van & Cash Icon -->
  <g transform="translate(14, 11)">
    <!-- Delivery Van Body -->
    <rect x="0" y="2" width="23" height="17" rx="2" fill="#EDF5EC" stroke="#087A3E" stroke-width="2"/>
    <path d="M23 7 L31 7 L36 13 L36 19 L23 19 Z" fill="#EDF5EC" stroke="#087A3E" stroke-width="2"/>
    <circle cx="8" cy="21" r="3.5" fill="#075B35"/>
    <circle cx="29" cy="21" r="3.5" fill="#075B35"/>
    <!-- Cash Banknote Badge on Van -->
    <rect x="5" y="6" width="13" height="8" rx="1.5" fill="#087A3E"/>
    <circle cx="11.5" cy="10" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Simple & Recognizable COD Typography -->
  <g transform="translate(64, 33)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" fill="#075B35" letter-spacing="1.5">COD</text>
    <text x="50" y="-1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#087A3E" letter-spacing="0.5">CASH</text>
  </g>
</svg>
