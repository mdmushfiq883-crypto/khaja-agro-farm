<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 50" width="160" height="50">
  <!-- Card Background -->
  <rect width="160" height="50" rx="8" fill="#FFFFFF"/>
  <rect x="0.5" y="0.5" width="159" height="49" rx="7.5" fill="none" stroke="#8C3494" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Rocket Ship Emblem -->
  <g transform="translate(12, 7)">
    <!-- Rocket Main Fuselage angled 45deg -->
    <g transform="rotate(-15, 18, 18)">
      <!-- Rocket Body -->
      <path d="M18 2 C23 7 26 15 26 23 L10 23 C10 15 13 7 18 2 Z" fill="#8C3494"/>
      <!-- Nose Cone -->
      <path d="M18 2 C20 4.5 21.5 8 22.5 11 L13.5 11 C14.5 8 16 4.5 18 2 Z" fill="#BD268D"/>
      <!-- Porthole Window -->
      <circle cx="18" cy="16" r="3.5" fill="#FFFFFF"/>
      <circle cx="18" cy="16" r="2.2" fill="#8C3494"/>
      <!-- Fins -->
      <path d="M10 19 L4 25 L10 24 Z" fill="#BD268D"/>
      <path d="M26 19 L32 25 L26 24 Z" fill="#BD268D"/>
      <path d="M16 23 L20 23 L19 25 L17 25 Z" fill="#6B1F73"/>
      <!-- Flame Trail -->
      <path d="M14 24 C16 29 18 34 18 34 C18 34 20 29 22 24 Z" fill="#F7941D"/>
      <path d="M16 24 C17 27 18 30 18 30 C18 30 19 27 20 24 Z" fill="#FFD100"/>
    </g>
  </g>

  <!-- Rocket Wordmark -->
  <g transform="translate(56, 33)">
    <text x="0" y="-3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hind Siliguri', sans-serif" font-size="20" font-weight="900" fill="#8C3494" letter-spacing="-0.3">রকেট</text>
    <text x="46" y="-5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#8C3494" letter-spacing="0.5">rocket</text>
  </g>
</svg>
